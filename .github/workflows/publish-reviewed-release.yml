name: Prepare reviewed Breakfast Live release
on:
  push:
    branches: [breakfast-live-integration]
    paths: ['.github/workflows/publish-reviewed-release.yml']
permissions:
  contents: write
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: breakfast-live-tested-release
          run-id: 34890077510
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .reviewed
      - name: Verify and install the exact tested files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('.reviewed')
          expected={'index.html':'8584ae9c92354e0bf73597959634ff12dd368aa8bb9540eb35df0890fe480293','breakfast-tablet.html':'3d0cd6178a7f82370638e5bc0cddbfd9ebde2ab39a89d32ff64e21d0fec967c6','README.md':'25a7460d44630e6a9c8fbb2f31f5f5337f0c53ba6bd73c8ad031dd16c2d409c0'}
          tests=json.loads((root/'test-results.json').read_text())
          assert not tests['javascript_errors'] and len(tests['passed'])==6
          old=Path('index.html').read_bytes()
          assert hashlib.sha1(b'blob '+str(len(old)).encode()+b'\0'+old).hexdigest()=='af537d26413e3090aa1fc6e5661b8d512ae404c4'
          for name,digest in expected.items():
              data=(root/'release'/name).read_bytes()
              assert hashlib.sha256(data).hexdigest()==digest,name
              Path(name).write_bytes(data)
          Path('README.md').write_text(Path('README.md').read_text().replace('bundled with their license headers','bundled locally; see THIRD-PARTY-NOTICES.txt for their licenses'))
          PY
      - name: Include QR dependency license notices
        run: |
          mkdir -p .build
          cat > .build/qrcode-LICENSE <<'TXT'
          MIT License
          Copyright (c) 2009 Kazuhiko Arase

          Permission is hereby granted, free of charge, to any person obtaining a copy
          of this software and associated documentation files (the "Software"), to deal
          in the Software without restriction, including without limitation the rights
          to use, copy, modify, merge, publish, distribute, sublicense, and/or sell
          copies of the Software, and to permit persons to whom the Software is
          furnished to do so, subject to the following conditions:

          The above copyright notice and this permission notice shall be included in
          all copies or substantial portions of the Software.

          THE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR
          IMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,
          FITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE
          AUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER
          LIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,
          OUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN
          THE SOFTWARE.
          TXT
          curl --fail --silent --show-error --location --retry 2 https://cdn.jsdelivr.net/npm/jsqr@1.4.0/LICENSE -o .build/jsQR-LICENSE
          { printf 'ADDITIONAL BREAKFAST LIVE DEPENDENCIES\n\nqrcode-generator 2.0.4\nSource: https://www.npmjs.com/package/qrcode-generator/v/2.0.4\n\n'; cat .build/qrcode-LICENSE; printf '\n\njsQR 1.4.0\nSource: https://www.npmjs.com/package/jsqr/v/1.4.0\n\n'; cat .build/jsQR-LICENSE; } > THIRD-PARTY-NOTICES.txt
      - name: Review top-of-page layout in an isolated browser
        run: |
          python3 -m venv .build/venv
          .build/venv/bin/pip -q install playwright==1.56.0
          .build/venv/bin/playwright install --with-deps chromium > .build/browser-install.log 2>&1
          .build/venv/bin/python - <<'PY'
          import asyncio,json
          from pathlib import Path
          from playwright.async_api import async_playwright
          async def main():
           async with async_playwright() as p:
            b=await p.chromium.launch(headless=True)
            page=await b.new_page(viewport={'width':1440,'height':1000})
            errors=[]
            page.on('pageerror',lambda e:errors.append(str(e)))
            await page.route('https://frontdesk.test/**',lambda route:route.fulfill(path=str(Path(route.request.url.rsplit('/',1)[-1]).resolve()),content_type='text/html'))
            await page.goto('https://frontdesk.test/index.html')
            for name in ['vcc','nightaudit','breakfastlive']:
             await page.locator('#tab-'+name).click()
            await page.evaluate('window.scrollTo(0,0)')
            await page.wait_for_timeout(600)
            rect=await page.locator('.brandbar').bounding_box()
            assert 0<=rect['y']<70,rect
            assert await page.locator('.tabpanel.active').count()==1
            await page.screenshot(path='pc-top-preview.png',full_page=True)
            await page.screenshot(path='pc-viewport-preview.png')
            assert not errors,errors
            Path('.build/layout-check.json').write_text(json.dumps({'header_bounds':rect,'javascript_errors':errors,'review':'Viewport and scroll-to-top screenshots generated before main publication.'},indent=2))
            await b.close()
          asyncio.run(main())
          PY
      - name: Commit only the reviewed production files to the development branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html breakfast-tablet.html README.md THIRD-PARTY-NOTICES.txt
          git commit -m 'Integrate native Breakfast Live tab and final tablet client'
          git push origin HEAD:breakfast-live-integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: breakfast-live-final-review
          path: |
            index.html
            breakfast-tablet.html
            README.md
            THIRD-PARTY-NOTICES.txt
            pc-*-preview.png
            .build/layout-check.json
          include-hidden-files: true
          retention-days: 7
