name: Breakfast Live release preparation
on:
  push:
    branches: [breakfast-live-integration]
    paths:
      - '.github/workflows/breakfast-live-release.yml'
      - 'integration/**'
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fetch the existing pinned QR dependencies
        run: |
          mkdir -p .build/vendor
          curl --fail --silent --show-error --location --retry 2 https://cdn.jsdelivr.net/npm/qrcode-generator@2.0.4/dist/qrcode.js -o .build/vendor/qrcode.js
          curl --fail --silent --show-error --location --retry 2 https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js -o .build/vendor/jsQR.js
          node --check .build/vendor/qrcode.js
          node --check .build/vendor/jsQR.js
          sha256sum .build/vendor/*.js > .build/vendor/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: breakfast-live-vendor
          path: .build/vendor/
          retention-days: 3
